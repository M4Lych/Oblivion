name: Android and backend checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"
      - name: Confirm Node.js
        run: |
          node --version
          npm --version
      - name: Install locked backend tooling
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check backend syntax
        run: |
          node --check backend/src/index.js
          node --check backend/src/access-control.js
          node --check backend/src/security.js
          node --check tools/oblivion.mjs
      - name: Run backend tests
        working-directory: backend
        run: npm test

  android:
    name: Android lint, unit tests and Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action defaults to the obsolete SDK package "tools". Modern
          # command-line tools are installed by the action itself; install only
          # platform-tools here, then pin the required packages below.
          packages: "platform-tools"
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Verify formatting and compile, lint, and test
        run: |
          git diff --check
          ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - name: Verify Debug APK exists
        shell: bash
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          badging="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")"
          package_line="$(printf '%s\n' "$badging" | grep -F "package: name='com.m4lych.oblivion'")"
          printf 'APK metadata: %s\n' "$package_line"
          printf 'APK size: %s bytes\n' "$(stat -c '%s' "$apk")"
          sha256sum "$apk"
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk" >/dev/null 2>&1; then
            echo "::error::Expected an unsigned Debug APK; refusing to upload a signed artifact."
            exit 1
          fi
          echo "Verified non-empty, structurally valid, unsigned Debug APK."
      - name: Upload unsigned Debug APK for manual testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oblivion-unsigned-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  mcbe-probe:
    name: Experimental MCBE compatibility probe
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Lint, test, and assemble isolated probe
        run: |
          git diff --check
          ./gradlew --no-daemon -p experiments/mcbe-host-spike :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - name: Verify experimental Debug APK
        shell: bash
        run: |
          apk="experiments/mcbe-host-spike/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          badging="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")"
          package_line="$(printf '%s\n' "$badging" | grep -F "package: name='com.m4lych.oblivion.hostspike'")"
          printf 'APK metadata: %s\n' "$package_line"
          printf 'APK size: %s bytes\n' "$(stat -c '%s' "$apk")"
          sha256sum "$apk"
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk" >/dev/null 2>&1; then
            echo "::error::Expected an unsigned experimental Debug APK; refusing to upload a signed artifact."
            exit 1
          fi
          echo "Verified non-empty, unsigned experimental probe APK. It does not contain or run Minecraft."
      - name: Upload experimental probe Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oblivion-mcbe-probe-debug-${{ github.sha }}
          path: experiments/mcbe-host-spike/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
